name: End-to-end (live API)

# Boots the real page in jsdom against the retailer's live Algolia index, so it is run by hand,
# not on every push: a network or upstream hiccup should not block a commit.
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
